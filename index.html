<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>I ❤️ BYO | National Gallery of Zimbabwe</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f6f3; color: #1b2024; }
    main { max-width: 700px; margin: 0 auto; padding: 24px 18px 38px; text-align: center; }
    .eyebrow { font-size: .8rem; letter-spacing: .17em; font-weight: 800; color: #657078; margin: 8px 0 10px; }
    h1 { font-size: clamp(1.65rem, 6vw, 2.4rem); line-height: 1.18; margin: 0 0 16px; }
    .intro { font-size: 1.05rem; line-height: 1.6; margin: 0 auto 20px; max-width: 560px; }
    model-viewer { display: block; width: 100%; height: min(57vh, 470px); min-height: 320px; background: radial-gradient(ellipse at 50% 45%, #fff 0%, #e8ebeb 100%); border-radius: 18px; overflow: hidden; --poster-color: transparent; }
    .ar-button { display: inline-flex; align-items: center; justify-content: center; background: #101820; color: white; border: 0; border-radius: 999px; padding: 15px 28px; font: inherit; font-size: 1.05rem; font-weight: 750; box-shadow: 0 5px 18px #0002; cursor: pointer; }
    .ar-button:focus-visible { outline: 3px solid #e19b1c; outline-offset: 4px; }
    .instructions { margin: 18px auto 0; max-width: 510px; font-size: .98rem; line-height: 1.55; color: #3c454b; }
    .tip { font-size: .85rem; color: #68727a; margin-top: 10px; }
    footer { margin-top: 28px; color: #68727a; font-size: .78rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">I ❤️ BYO · AR EXPERIENCE</p>
    <h1>Welcome to the National Gallery of Zimbabwe!</h1>
    <p class="intro">Step into our courtyard, bring “I ❤️ BYO” to life in AR, and take a photo to remember your visit!</p>

    <model-viewer
      id="byo-model"
      src="./i-love-byo.glb"
      alt="3D I love BYO monument for the National Gallery of Zimbabwe"
      ar
      ar-modes="scene-viewer webxr quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      interaction-prompt="auto"
      touch-action="pan-y">
      <button class="ar-button" slot="ar-button" type="button">View in AR</button>
    </model-viewer>

    <p class="instructions"><strong>AR tip:</strong> Move your phone from side to side and take a few steps to scan the area.</p>
    <footer>National Gallery of Zimbabwe in Bulawayo</footer>
  </main>
</body>
</html>
